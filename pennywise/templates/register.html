{% extends 'base.html' %}
{% block title %}Create Account | Pennywise Cosmetics{% endblock %}

{% block extra_head %}
<style>
.auth-page { padding: 60px 0 100px; display: flex; justify-content: center; }
.auth-card { width: 100%; max-width: 440px; background: white; border-radius: var(--radius); border: 1.5px solid var(--border); padding: 48px 40px; box-shadow: var(--shadow); }
.auth-logo { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.4rem; color: var(--hot-pink); text-align: center; margin-bottom: 8px; }
.auth-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
.auth-sub { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 32px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { margin-bottom: 20px; }
.form-label { font-size: 0.82rem; font-weight: 700; color: var(--text); display: block; margin-bottom: 6px; }
.form-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'Nunito', sans-serif; font-size: 0.9rem; outline: none; color: var(--text); transition: border-color 0.2s; }
.form-input:focus { border-color: var(--hot-pink); }
.auth-switch { text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted); }
.auth-switch a { color: var(--hot-pink); font-weight: 700; text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="page-content auth-page">
    <div class="auth-card">
        <div class="auth-logo">Pennywise Cosmetics</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join thousands of beauty lovers in T&T</p>
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-input" placeholder="First" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-input" placeholder="Last" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Choose a strong password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:14px;">Create Account</button>
        </form>
        <div class="auth-switch">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
